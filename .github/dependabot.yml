version: 2
updates:
  # .github/workflows/ 配下の全 workflow が対象。SHA pin と横の # vN コメントを更新する。
  - package-ecosystem: github-actions
    directory: /
    # 派生側の template-sync（土曜 09:00）より前に終えるため nix と同じ時刻にそろえる
    schedule:
      interval: weekly
      day: saturday
      time: "08:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 2
    open-pull-requests-limit: 0

  # flake.lock の全 input が対象。skill / rules の取得元も flake = false な input なので
  # ここに含まれ、input ごとに PR が立つ。skill / rules の PR だけ dependabot-auto-merge が
  # 素通りさせるので、dependabot-review スキルでレビューして手動マージする
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "08:00"
      timezone: Asia/Tokyo
    cooldown:
      default-days: 2
    open-pull-requests-limit: 0
