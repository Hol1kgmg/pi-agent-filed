version: 2
updates:
  # .github/workflows/ 配下の全 workflow が対象。SHA pin と横の # vN コメントを更新する。
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  # flake.lock の全 input が対象。skill / rules の取得元も flake = false な input なので
  # ここに含まれ、input ごとに PR が立つ。レビューは dependabot-review スキルで行う
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
