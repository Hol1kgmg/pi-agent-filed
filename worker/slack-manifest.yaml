# https://api.slack.com/apps → Create New App → From a manifest。request_url は `just tunnel` の URL に置き換える
display_information:
  name: pi-po
features:
  bot_user:
    display_name: pi-po
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
settings:
  event_subscriptions:
    request_url: https://example.trycloudflare.com/slack/events
    bot_events:
      - app_mention
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
